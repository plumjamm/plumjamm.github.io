<nav class="tree">
  <div class="tree-title">目录</div>
  {% for category in site.tree_categories %}
  <details class="tree-node" {% if page.categories contains category %}open{% endif %}>
    <summary>
      <span class="tree-folder-name">{{ category }}</span>
      <span class="tree-count">{{ site.categories[category] | size }}</span>
    </summary>
    <ul class="tree-children">
      {% for post in site.categories[category] %}
      <li>
        <a href="{{ post.url | relative_url }}" {% if page.url == post.url %}class="active"{% endif %}>{{ post.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </details>
  {% endfor %}
</nav>
