<nav class="tree">
  <div class="tree-title">
    <svg class="tree-title-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
      <path d="M2 4a1 1 0 100-2 1 1 0 000 2zm3.75-2.5a.75.75 0 000 1.5h8.5a.75.75 0 000-1.5h-8.5zm0 5a.75.75 0 000 1.5h8.5a.75.75 0 000-1.5h-8.5zm0 5a.75.75 0 000 1.5h8.5a.75.75 0 000-1.5h-8.5zM3 8a1 1 0 11-2 0 1 1 0 012 0zm-1 5a1 1 0 100-2 1 1 0 000 2z"/>
    </svg>
    目录
  </div>
  {% for category in site.categories %}
  <details class="tree-node" {% if page.categories contains category[0] %}open{% endif %}>
    <summary>
      <svg class="tree-arrow" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
        <path d="M6.427 4.427l3.396 3.396a.25.25 0 010 .354l-3.396 3.396A.25.25 0 016 11.396V4.604a.25.25 0 01.427-.177z"/>
      </svg>
      <svg class="tree-folder tree-folder-closed" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/>
      </svg>
      <svg class="tree-folder tree-folder-open" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M.513 1.513A1.75 1.75 0 011.75 1h3.5c.55 0 1.07.26 1.4.7l.9 1.2a.25.25 0 00.2.1H13a1 1 0 011 1v.5H2.75a.75.75 0 00-.75.75v8.5a.75.75 0 001.5 0v-8h10a.75.75 0 00.75-.75V4a2 2 0 00-2-2H8.5a.25.25 0 01-.2-.1l-.9-1.2A1.75 1.75 0 005.75 0h-4A1.75 1.75 0 000 1.75v11.5C0 14.216.784 15 1.75 15h3.5a.75.75 0 000-1.5h-3.5a.25.25 0 01-.25-.25V1.75c0-.13.01-.26.013-.237z"/>
      </svg>
      <span class="tree-folder-name">{{ category[0] }}</span>
      <span class="tree-count">{{ category[1] | size }}</span>
    </summary>
    <ul class="tree-children">
      {% for post in category[1] %}
      <li>
        <svg class="tree-file" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
          <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0113.25 16h-9.5A1.75 1.75 0 012 14.25V1.75z"/>
        </svg>
        <a href="{{ post.url | relative_url }}" {% if page.url == post.url %}class="active"{% endif %}>{{ post.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </details>
  {% endfor %}
</nav>
